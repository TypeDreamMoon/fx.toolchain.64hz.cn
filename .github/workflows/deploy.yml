name: Build and deploy

on:
  workflow_call:
    inputs:
      site_ref:
        type: string
        required: true
      artifact:
        type: string
        default: ''
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Compare the export without changing server files
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

# All publishing branches share a web root. Finish an active deployment before
# starting another; only superseded pull-request checks may be cancelled.
concurrency:
  group: deploy-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    name: Build and deploy static site
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.site_ref || github.sha }}

      - name: Test documentation sync
        if: inputs.artifact == ''
        run: python3 -B -m unittest discover -s scripts -p 'test_docs*.py'

      - name: Test deploy helper
        if: inputs.artifact == ''
        run: python3 -B -m unittest discover -s scripts -p test_deploy_rsync.py

      - name: Setup Node
        if: inputs.artifact == ''
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: inputs.artifact == ''
        run: npm ci

      - name: Typecheck
        if: inputs.artifact == ''
        run: npm run typecheck

      - name: Build
        if: inputs.artifact == ''
        run: npm run build

      # Pure stdlib Python, and it reads out/ — so it checks what actually
      # shipped rather than what the sources looked like they meant.
      - name: Check internal links
        if: inputs.artifact == ''
        run: python3 scripts/check-links.py

      # A missing credential otherwise surfaces as an SSH timeout several
      # minutes in, which reads like a server problem and is not one.
      - name: Check deploy credentials
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PRIVATE_KEY: ${{ secrets.SFTP_PRIVATE_KEY }}
        run: |
          if [ -z "$SFTP_PASSWORD" ] && [ -z "$SFTP_PRIVATE_KEY" ]; then
            echo "::error::Set either the SFTP_PASSWORD or the SFTP_PRIVATE_KEY repository secret."
            exit 1
          fi

      - name: Verify documentation state
        run: python3 -B scripts/docs_sync.py validate

      - name: Download the validated sync build
        if: inputs.artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: out

      - name: Refuse stale production deployment
        id: production
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: python
        run: |
          import os, subprocess
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()
          remote = git("ls-remote", "origin", "refs/heads/" + os.environ["DEFAULT_BRANCH"]).split()[0]
          current = git("rev-parse", "HEAD")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("current=" + str(remote == current).lower() + "\n")
          if remote != current:
              print("A newer website commit exists; this older build will not deploy.")

      - name: Sync static export via rsync
        if: steps.production.outputs.current == 'true'
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PRIVATE_KEY: ${{ secrets.SFTP_PRIVATE_KEY }}
          SFTP_PASSPHRASE: ${{ secrets.SFTP_PASSPHRASE }}
          SFTP_REMOTE_DIR: ${{ secrets.SFTP_REMOTE_DIR }}
          SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
          DEPLOY_DRY_RUN: ${{ inputs.dry_run || false }}
        run: python3 scripts/deploy_rsync.py --default-remote-dir /www/wwwroot/fx.toolchain.64hz.cn
